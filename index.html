<h1>楓之谷 合成利潤計算器 <span class="mut small" id="ver"></span></h1>
<div class="sub">① 左邊填材料的市場價 → ② 右邊每個配方自動加總「全部材料 + 手續費」得到成本，再扣掉商店賣出總額，算出獲利。</div>

<div class="grid">
<div class="card">
  <h2>① 材料市場價（買入價）</h2>
  <div class="mut small" style="margin-bottom:6px">填你取得 1 個的價格；自己打的填 0。灰字是 NPC 商店買價，不填就用它。</div>
  <div class="bar">
    <input type="text" id="q1" placeholder="搜尋材料…" size="12">
    <label><input type="checkbox" id="missingOnly"> 只看還沒填的</label>
  </div>
  <div class="scroll"><table id="items"><thead><tr><th>材料</th><th>買入價</th></tr></thead><tbody></tbody></table></div>
  <div class="small mut" id="itemNote"></div>
  <button class="g" id="export">匯出價格</button><button class="g" id="import">匯入價格</button><button class="g" id="clear">清除</button>
  <input type="file" id="file" accept=".json" hidden>
</div>

<div class="card">
  <h2>② 配方損益</h2>
  <div class="small" style="margin-bottom:4px"><b>只看這些 NPC 的合成單：</b>
    <button class="g" id="npcAll" style="padding:1px 8px;margin:0 4px">全選</button><button class="g" id="npcNone" style="padding:1px 8px;margin:0">全不選</button></div>
  <div class="bar small" id="npcs" style="margin-bottom:10px"></div>
  <div class="bar">
    <input type="text" id="q2" placeholder="搜尋成品或材料…">
    <select id="cat"><option value="nonEquip">消耗品／材料</option><option value="equip">裝備</option><option value="">全部</option></select>
    <label><input type="checkbox" id="onlyPriced"> 只顯示材料價格已齊的</label>
    <label><input type="checkbox" id="onlyPos"> 只顯示正收益</label>
    <label><input type="checkbox" id="hideUn" checked> 隱藏未命名／未開放道具</label>
    <label title="材料本身也能合成時，取「直接買」與「自己合成」較低者"><input type="checkbox" id="chain" checked> 材料可合成時取較低成本</label>
  </div>
  <div class="scroll"><table id="result"><thead><tr>
    <th>成品</th><th>材料明細（單價 × 數量）</th><th class="s" data-k="cost">總成本</th>
    <th>商店賣價/個</th><th class="s" data-k="rev">賣出總額</th><th class="s" data-k="profit">獲利</th><th class="s" data-k="roi">報酬率</th>
  </tr></thead><tbody></tbody></table></div>
  <div class="small mut" id="resNote" style="margin-top:6px"></div>
</div>
</div>

R.forEach(r=>{r.n0=r.n;r.m0=r.m.map(a=>[...a])});
const recKey=r=>r.o+':'+r.n0+':'+r.m0.map(m=>m[0]+'x'+m[1]).join(',');
function applyOv(){
  const all=user.__r||{};
  R.forEach(r=>{
    r.n=r.n0;r.m=r.m0.map(a=>[...a]);r.fo=null;
    const ov=all[recKey(r)];if(!ov)return;
    if(ov.n>0)r.n=ov.n;
    if(ov.f!=null)r.fo=ov.f;
    if(ov.q)Object.entries(ov.q).forEach(([i,v])=>{if(r.m[i]&&v>=0)r.m[i][1]=v});
  });
}
const isEdited=r=>r.n!==r.n0||r.fo!=null||r.m.some((m,i)=>m[1]!==r.m0[i][1]);
function setOv(r,fn){
  const all=user.__r=user.__r||{},k=recKey(r);
  const ov=all[k]=all[k]||{};fn(ov);
  if(!isEdited(r))delete all[k];
  save();
}
function resetOv(r){const all=user.__r||{};delete all[recKey(r)];save();applyOv()}

// ---------- NPC 篩選：只算選中 NPC 的合成單 ----------
const NPC_KEY='mapleCraft.npcs';
const npcOf=w=>w[0].split('（')[0];
const npcCount={};
R.forEach(r=>new Set(r.w.map(npcOf)).forEach(n=>npcCount[n]=(npcCount[n]||0)+1));
const allNpcs=Object.keys(npcCount).sort((a,b)=>npcCount[b]-npcCount[a]);
let selNpc=(()=>{try{const s=JSON.parse(localStorage.getItem(NPC_KEY));if(Array.isArray(s))return new Set(s)}catch(e){}
  return new Set(['伯堅','比休斯','派伊','高登','蓓依'].filter(n=>n in npcCount))})();
const saveNpc=()=>{try{localStorage.setItem(NPC_KEY,JSON.stringify([...selNpc]))}catch(e){}};
// 該配方在選中 NPC 之下的最低手續費；沒有任何選中 NPC 可做則為 null
const baseFee=r=>{let f=null;r.w.forEach(w=>{if(selNpc.has(npcOf(w))&&(f==null||w[1]<f))f=w[1]});return f};
const feeOf=r=>{const f=baseFee(r);return f==null?null:(r.fo!=null?r.fo:f)};
let active=[],matUse={},byOut={},matIds=[];
function rebuild(){
  active=R.filter(r=>feeOf(r)!=null);
  matUse={};byOut={};
  active.forEach(r=>{r.m.forEach(([id])=>matUse[id]=(matUse[id]||0)+1);(byOut[r.o]=byOut[r.o]||[]).push(r)});
  matIds=Object.keys(matUse).map(Number).sort((a,b)=>matUse[b]-matUse[a]);
}
function renderNpcs(){

  allNpcs.forEach(n=>{

    l.innerHTML='<input type="checkbox"> ';l.append(`${n} (${npcCount[n]})`);
    const c=l.querySelector('input');c.checked=selNpc.has(n);
    c.addEventListener('input',()=>{c.checked?selNpc.add(n):selNpc.delete(n);saveNpc();rebuild();renderItems();renderResult()});
    box.appendChild(l);
  });
}
$('npcAll').onclick=()=>{selNpc=new Set(allNpcs);saveNpc();renderNpcs();rebuild();renderItems();renderResult()};
$('npcNone').onclick=()=>{selNpc=new Set();saveNpc();renderNpcs();rebuild();renderItems();renderResult()};

function renderItems(){
  const q=$('q1').value.trim();
  let ids=matIds;
  if(q)ids=ids.filter(id=>nm(id).includes(q));
  if($('hideUn').checked)ids=ids.filter(id=>!isUn(id));
  if($('missingOnly').checked)ids=ids.filter(id=>buyOf(id)==null);
  const tb=$('items').querySelector('tbody');tb.innerHTML='';
  ids.forEach(id=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td></td><td><input type="number" min="0" step="any"></td>';
    tr.children[0].textContent=nm(id);
    const inp=tr.querySelector('input');
    inp.value=user[id]&&user[id].b!=null?user[id].b:'';
    if(I[id]&&I[id].b!=null)inp.placeholder=fmt(I[id].b);
    inp.addEventListener('input',()=>{
      user[id]=user[id]||{};
      if(inp.value==='')delete user[id].b;else user[id].b=+inp.value;
      save();renderResult();
    });
    tb.appendChild(tr);
  });
  $('itemNote').textContent=`${ids.length} 種材料`;
}

// ---------- 計算 ----------
let memo={};
function unit(id,stack,chain){
  const b=buyOf(id);
  if(!chain||!byOut[id]||stack.includes(id))return b;
  if(id in memo)return memo[id];
  let best=b;
  for(const r of byOut[id]){
    let t=feeOf(r),ok=true;
    for(const [mid,c] of r.m){const u=unit(mid,[...stack,id],chain);if(u==null){ok=false;break}t+=u*c}
    if(ok){const v=t/r.n;if(best==null||v<best)best=v}
  }
  memo[id]=best;return best;
}
function calc(r){
  const chain=$('chain').checked;
  const fee=feeOf(r)||0;
  let cost=fee,miss=0;
  const lines=r.m.map(([id,c])=>{
    const u=unit(id,[r.o],chain);
    if(u==null)miss++;else cost+=u*c;
    return {id,c,u,sub:u==null?null:u*c};
  });
  const ok=miss===0, s=sellOf(r.o), rev=s==null?null:s*r.n;
  const full=ok&&rev!=null;
  return {lines,fee,ok,cost:ok?cost:null,s,rev,profit:full?rev-cost:null,
    roi:full?(cost>0?(rev-cost)/cost:(rev>0?Infinity:0)):null};
}

function visibleRecipes(){
  const q=$('q2').value.trim(), cat=$('cat').value, hide=$('hideUn').checked;
  return active.filter(r=>{
    if(hide&&(isUn(r.o)||r.m.some(([id])=>isUn(id))))return false;
    const equip=I[r.o]&&I[r.o].c==='裝備';
    if(cat==='nonEquip'&&equip)return false;
    if(cat==='equip'&&!equip)return false;
    if(q&&!(nm(r.o).includes(q)||r.m.some(([id])=>nm(id).includes(q))))return false;
    return true;
  });
}

  tr.querySelectorAll('.q').forEach((q,i)=>q.classList.toggle('ed',r.m[i][1]!==r.m0[i][1]));
  tr.querySelector('.rst').style.display=isEdited(r)?'':'none';
  tr.querySelector('.cost').textContent=x.cost==null?'缺材料價格':fmt(x.cost);
  tr.querySelector('.rev').textContent=x.rev==null?'填賣價 →':fmt(x.rev);
  const p=tr.querySelector('.profit');p.className='profit big '+cls;
  p.textContent=x.profit==null?'—':(x.profit>0?'+':'')+fmt(x.profit);
  const ro=tr.querySelector('.roi');ro.className='roi '+cls;
  ro.textContent=x.roi==null?'—':(x.roi===Infinity?'∞':(x.roi*100).toFixed(1)+'%');
}
function renderResult(){
  memo={};
  let rows=visibleRecipes().map(r=>({r,x:calc(r)}));
  if($('onlyPriced').checked)rows=rows.filter(o=>o.x.ok);
  if($('onlyPos').checked)rows=rows.filter(o=>o.x.profit!=null&&o.x.profit>0);
  rows.sort((a,b)=>{
    const va=a.x[sortK],vb=b.x[sortK];
    if(va==null&&vb==null)return nm(a.r.o).localeCompare(nm(b.r.o));
    if(va==null)return 1;if(vb==null)return -1;
    return desc?vb-va:va-vb;
  });
  const total=rows.length;rows=rows.slice(0,200);
  const tb=$('result').querySelector('tbody');tb.innerHTML='';
  if(!rows.length)tb.innerHTML='<tr><td colspan="7" class="mut" style="text-align:center;padding:16px">沒有符合的配方</td></tr>';
  rows.forEach(({r,x})=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="name"><b></b> × <input class="en" type="number" min="1" step="1" title="產出數，可修改"><div class="mut small npc"></div><a class="rst small" href="#" style="display:none">還原成遊戲原值</a></td>
      <td class="mats"></td><td class="cost"></td>
      <td><input class="sp" type="number" min="0" step="any"></td><td class="rev"></td><td class="profit"></td><td class="roi"></td>`;
    tr.querySelector('b').textContent=nm(r.o);
    tr.querySelector('.npc').textContent=r.w.filter(w=>selNpc.has(npcOf(w))).map(([n,f])=>n+(f?` 費${fmt(f)}`:'')).join(' ／ ');
    // 材料明細（數量可改）+ 手續費（可改）
    const mt=tr.querySelector('.mats');
    r.m.forEach(([id,c],i)=>{
      const d=document.createElement('div');
      d.innerHTML='<span></span><span><span class="u"></span> × <input class="q" type="number" min="0" step="1"> <span class="sub"></span></span>';
      d.firstChild.textContent=nm(id);d.querySelector('.q').value=c;
      d.querySelector('.q').addEventListener('input',e=>{
        const v=num(e.target.value);if(v==null||v<0)return;
        r.m[i][1]=v;setOv(r,o=>{o.q=o.q||{};o.q[i]=v});memo={};fillRow(tr,r,calc(r));
      });
      d.querySelector('.q').addEventListener('change',renderResult);
      mt.appendChild(d);
    });
    const fd=document.createElement('div');
    fd.innerHTML='<span>手續費</span><span><input class="fee" type="number" min="0" step="any"></span>';
    const fi=fd.querySelector('input');fi.value=r.fo!=null?r.fo:'';fi.placeholder=fmt(baseFee(r));
    fi.addEventListener('input',()=>{
      const v=num(fi.value);r.fo=v;setOv(r,o=>{if(v==null)delete o.f;else o.f=v});memo={};fillRow(tr,r,calc(r));
    });
    fi.addEventListener('change',renderResult);
    mt.appendChild(fd);
    const en=tr.querySelector('.en');en.value=r.n;
    en.addEventListener('input',()=>{
      const v=num(en.value);if(v==null||v<1)return;
      r.n=v;setOv(r,o=>{o.n=v});memo={};fillRow(tr,r,calc(r));
    });
    en.addEventListener('change',renderResult);
    tr.querySelector('.rst').addEventListener('click',e=>{e.preventDefault();resetOv(r);rebuild();renderItems();renderResult()});
    const inp=tr.querySelector('.sp');
    inp.value=user[r.o]&&user[r.o].s!=null?user[r.o].s:'';
    if(I[r.o]&&I[r.o].s!=null)inp.placeholder=fmt(I[r.o].s);
    inp.addEventListener('input',()=>{
      user[r.o]=user[r.o]||{};
      if(inp.value==='')delete user[r.o].s;else user[r.o].s=+inp.value;
      save();fillRow(tr,r,calc(r));           // 只更新這一列，輸入不會失焦
    });
    inp.addEventListener('change',renderResult); // 輸入完成後重新排序
    fillRow(tr,r,x);
    tb.appendChild(tr);
  });
  $('resNote').textContent=`顯示 ${rows.length}/${total} 筆。獲利 = 賣價/個 × 產出數 − (全部材料 + 手續費)。成品旁的產出數、材料數量、手續費都可以直接改（橘色框＝你改過，可「還原」）。商店賣價欄灰字為遊戲資料內建值（目前只有裝備有）；消耗品如箭矢請自行填入。`;
}

['q1','missingOnly'].forEach(i=>$(i).addEventListener('input',renderItems));
$('hideUn').addEventListener('input',()=>{renderItems();renderResult()});
['q2','cat','onlyPriced','onlyPos','chain'].forEach(i=>$(i).addEventListener('input',renderResult));
document.querySelectorAll('th.s').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)desc=!desc;else{sortK=k;desc=true}renderResult()});
$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(user)],{type:'application/json'}));a.download='maple-prices.json';a.click()};
$('import').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{user=JSON.parse(t);save();applyOv();rebuild();renderItems();renderResult()}catch(_){alert('匯入失敗')}})};
$('clear').onclick=()=>{if(confirm('清除你填的所有價格與配方修改？')){user={};save();applyOv();rebuild();renderItems();renderResult()}};
// 記住篩選勾選狀態
const UI_KEY='mapleCraft.ui', UI_IDS=['onlyPos','onlyPriced','hideUn','chain','missingOnly'];
try{const s=JSON.parse(localStorage.getItem(UI_KEY))||{};UI_IDS.forEach(i=>{if(i in s)$(i).checked=!!s[i]});if(s.cat)$('cat').value=s.cat}catch(e){}
const saveUi=()=>{try{const s={cat:$('cat').value};UI_IDS.forEach(i=>s[i]=$(i).checked);localStorage.setItem(UI_KEY,JSON.stringify(s))}catch(e){}};
[...UI_IDS,'cat'].forEach(i=>$(i).addEventListener('input',saveUi));
applyOv();renderNpcs();rebuild();renderItems();renderResult();
</script>
</body>
</html>
